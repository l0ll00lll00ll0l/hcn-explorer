<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>HCN Explorer</title>
    <style>
        body { font-family: monospace; margin: 40px; }
        .config-panel { border: 1px solid #ccc; padding: 30px; max-width: 500px; margin-bottom: 30px; }
        .option { margin: 10px 0; }
        .sub-option { margin-left: 25px; margin-top: 6px; }
        button { margin-top: 20px; padding: 8px 20px; font-family: monospace; font-size: 1em; }
        table { border-collapse: collapse; font-size: 12px; }
        th { background: #333; color: white; padding: 6px 10px; text-align: left; }
        td { padding: 6px 10px; border-bottom: 1px solid #ddd; }
        tr:hover { background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>HCN Explorer</h1>

    <div class="config-panel">
        <h3>Start New HCN Application</h3>
        <form method="post" action="/start">
            <div class="option">
                <label><input type="checkbox" name="collectData" value="true" checked onchange="toggleCollectData()"> Collect Data</label>
            </div>
            <div class="sub-option">
                <label><input type="checkbox" name="basicData" value="true" id="basicDataCb" checked> Basic Data</label>
            </div>
            <button type="submit">Start</button>
        </form>
    </div>

    <div>
        <h3>Existing Databases</h3>
        <table>
            <thead>
                <tr>
                    <th>Database</th>
                    <th>Proved</th>
                    <th>Last Prime Index</th>
                    <th>Basic Data</th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="db : ${databases}">
                    <td th:text="${db.name}"></td>
                    <td th:text="${db.provedCount}"></td>
                    <td th:text="${db.lastProvedPrimeIndex}"></td>
                    <td th:text="${db.basicData}"></td>
                    <td><a th:href="@{/core(dbName=${db.name})}">Load</a></td>
                    <td><form method="post" action="/delete" style="display:inline;"><input type="hidden" name="dbName" th:value="${db.name}"/><button type="submit" style="color:red; border:none; background:none; cursor:pointer; font-family:monospace;">Delete</button></form></td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function toggleCollectData() {
            var collectData = document.querySelector('input[name="collectData"]').checked;
            var basicDataCb = document.getElementById('basicDataCb');
            if (collectData) {
                basicDataCb.disabled = false;
            } else {
                basicDataCb.checked = false;
                basicDataCb.disabled = true;
            }
        }
    </script>
</body>
</html>
