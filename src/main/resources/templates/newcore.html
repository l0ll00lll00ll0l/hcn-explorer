<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>HCN - New Core</title>
    <style>
        body { font-family: monospace; margin: 20px; }
        .tab-bar { display: flex; gap: 4px; margin-bottom: 10px; }
        .tab-btn { padding: 6px 14px; border: 1px solid #ccc; background: #eee; cursor: pointer; font-family: monospace; }
        .tab-btn.active { background: #333; color: white; }
        .matrix-chain { display: flex; gap: 8px; align-items: flex-end; overflow-x: auto; padding: 10px 0; }
        .matrix-box { border: 1px solid #333; min-width: 120px; background: #fafafa; }
        .matrix-box-header { padding: 4px 8px; font-size: 11px; text-align: center; font-weight: bold; }
        .matrix-box-content { padding: 6px 8px; font-size: 11px; }
        .matrix-box-footer { background: #333; color: white; padding: 4px 8px; font-size: 10px; text-align: center; }
        .transition-panel { border: 1px solid #ccc; padding: 4px 8px; margin: 3px 0; font-size: 11px; }
        .transition-id { font-weight: bold; margin-right: 6px; }
        .bodynode-btn { border: 1px solid #666; padding: 4px 8px; margin: 4px 8px; text-align: center; font-size: 10px; cursor: pointer; background: #eee; }
        .bodylist-selector { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
        .bodylist-btn { padding: 4px 10px; border: 1px solid #ccc; background: #eee; cursor: pointer; font-family: monospace; font-size: 11px; }
        .bodylist-btn.active { background: #333; color: white; }
        .bodylist-panel { margin-top: 8px; }
        .lapi-chain { display: flex; gap: 8px; align-items: flex-start; overflow-x: auto; padding: 10px 0; }
        .lapi-box { border: 1px solid #333; min-width: 150px; background: #fafafa; }
        .lapi-next { margin-right: 30px; }
        .lapi-header { background: #333; color: white; padding: 4px 8px; font-size: 11px; text-align: center; }
        .lapi-content { padding: 4px; font-size: 11px; max-height: 300px; overflow-y: auto; }
        .level-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .level-table th { background: #333; color: white; padding: 4px 6px; text-align: left; position: sticky; top: 0; }
        .level-table td { padding: 4px 6px; border-bottom: 1px solid #ddd; }
        .level-table tr:hover { background: #f5f5f5; }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <h2 style="margin: 0;">HCN - New Core</h2>
            <form id="proveForm" style="display: flex; align-items: center; gap: 4px;">
                <button type="submit" id="proveBtn" style="font-family: monospace; padding: 4px 12px;" th:disabled="${@activityCenter.isProving()}">Prove</button>
            </form>
            <div id="progressBar" style="display: none; align-items: center; gap: 6px;">
                <div style="width: 150px; height: 16px; border: 1px solid #333; background: #eee;">
                    <div id="progressFill" style="height: 100%; background: #4caf50; width: 0%; transition: width 0.3s;"></div>
                </div>
                <span id="progressText" style="font-size: 11px;"></span>
            </div>
            <span th:if="${!@activityCenter.isProving()}" style="font-size: 11px; color: #555;">
                | proved: <b th:text="${matrix.provedCount}"></b>
                | nextLapi: <b th:text="${matrix.nextLapi != null ? matrix.nextLapi.prime.index + ' (' + matrix.nextLapi.prime.intValue + ')' : 'n/a'}"></b>
                | limit: <b th:text="${matrix.provedLimit}"></b>
                | total: <b th:text="${matrix.totalTimeMs} + 'ms'"></b>
                | hcnList: <b th:text="${matrix.generateHcnListTimeMs} + 'ms'"></b>
                | maintain: <b th:text="${matrix.matrixMaintainTimeMs} + 'ms'"></b>
                <span th:if="${matrix.dbMode}" style="color: #c00;"> | dbMode: <b>ON</b></span>
            </span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <form method="post" action="/newcore/loglevel" style="display: flex; align-items: center; gap: 4px;">
                <select name="level" style="font-family: monospace; padding: 2px;">
                    <option value="DEBUG" th:selected="${logLevel == 'DEBUG'}">DEBUG</option>
                    <option value="INFO" th:selected="${logLevel == 'INFO'}">INFO</option>
                    <option value="WARN" th:selected="${logLevel == 'WARN'}">WARN</option>
                </select>
                <button type="submit" style="font-family: monospace; padding: 4px 8px;">Set Log</button>
            </form>
            <form method="post" action="/newcore/save" style="display: inline;">
                <button type="submit" style="font-family: monospace; padding: 4px 12px;" th:disabled="${@activityCenter.isProving()}">Save</button>
            </form>
            <a href="/newcore/quit" style="font-family: monospace; padding: 4px 12px; border: 1px solid #ccc; text-decoration: none; color: black;">Quit</a>
        </div>
    </div>

    <div th:if="${!@activityCenter.isProving()}">
        <div class="tab-bar">
            <button class="tab-btn" th:classappend="${activeTab == 'matrix' ? ' active' : ''}"        onclick="loadTab('matrix')">Matrix</button>
            <button class="tab-btn" th:classappend="${activeTab == 'bodynodes' ? ' active' : ''}"     onclick="loadTab('bodynodes')">BodyList</button>
            <button class="tab-btn" th:classappend="${activeTab == 'bodynode' ? ' active' : ''}"      onclick="loadTab('bodynode')">BodyNode</button>
            <button class="tab-btn" th:classappend="${activeTab == 'hcngen' ? ' active' : ''}"        onclick="loadTab('hcngen')">Hcn Generation</button>
            <button class="tab-btn" th:classappend="${activeTab == 'lapi' ? ' active' : ''}"          onclick="loadTab('lapi')">Lapi</button>
            <button class="tab-btn" th:classappend="${activeTab == 'recorderlist' ? ' active' : ''}"   onclick="loadTab('recorderlist')">RecorderList</button>
            <button th:if="${matrix.dbMode}" class="tab-btn" th:classappend="${activeTab == 'database' ? ' active' : ''}"       onclick="loadTab('database')">Database</button>
            <button class="tab-btn" th:classappend="${activeTab == 'refinterval' ? ' active' : ''}"    onclick="loadTab('refinterval')">ReferenceInterval</button>
            <button class="tab-btn" th:classappend="${activeTab == 'currentinterval' ? ' active' : ''}" onclick="loadTab('currentinterval')">CurrentInterval</button>
            <button th:if="${matrix.dbMode}" class="tab-btn" th:classappend="${activeTab == 'activities' ? ' active' : ''}" onclick="loadTab('activities')">Activities</button>
        </div>
        <div id="tab-content"></div>
    </div>

    <script th:inline="javascript">
        var tabCache = {};
        var activeTab = /*[[${activeTab}]]*/ 'matrix';
        var activeSubTab = /*[[${activeSubTab}]]*/ null;

        function loadTab(tab, subtab, forceReload) {
            if (!forceReload && tab !== 'database' && tab !== 'activities' && tabCache[tab]) {
                showTab(tab, tabCache[tab]);
                return;
            }
            var url = '/newcore/tab?tab=' + tab + (subtab ? '&subtab=' + subtab : '');
            fetch(url).then(r => r.text()).then(function(html) {
                tabCache[tab] = html;
                showTab(tab, html);
            });
        }

        function showTab(tab, html) {
            var container = document.getElementById('tab-content');
            container.innerHTML = html;
            container.querySelectorAll('script').forEach(function(oldScript) {
                eval(oldScript.textContent);
            });
            document.querySelectorAll('.tab-bar .tab-btn').forEach(function(b) { b.classList.remove('active'); });
            var btn = document.querySelector('.tab-btn[onclick="loadTab(\'' + tab + '\')"]');
            if (btn) btn.classList.add('active');
            activeTab = tab;
        }

        function openBodyList(idx) {
            fetch('/newcore/tab?tab=bodynodes&matrixNodeIdx=' + idx)
                .then(r => r.text()).then(function(html) {
                    tabCache['bodynodes'] = html;
                    showTab('bodynodes', html);
                });
        }

        function openBodyNode(matrixIdx, bodyNodeId) {
            fetch('/newcore/tab?tab=bodynode&matrixNodeIdx=' + matrixIdx + '&bodyNodeId=' + bodyNodeId)
                .then(r => r.text()).then(function(html) {
                    tabCache['bodynode'] = html;
                    showTab('bodynode', html);
                });
        }

        // Prove form via AJAX
        document.getElementById('proveForm').addEventListener('submit', function(e) {
            e.preventDefault();
            tabCache = {};
            fetch('/newcore/prove', { method: 'POST' })
                .then(function() { startPolling(); });
        });

        // Progress polling
        var pollInterval = null;
        function startPolling() {
            document.getElementById('progressBar').style.display = 'flex';
            document.getElementById('proveBtn').disabled = true;
            pollInterval = setInterval(function() {
                fetch('/newcore/progress').then(r => r.json()).then(function(data) {
                    var pct = data.target > 0 ? (data.progress / data.target * 100) : 0;
                    document.getElementById('progressFill').style.width = pct + '%';
                    document.getElementById('progressText').textContent = data.progress + '/' + data.target;
                    if (!data.proving) {
                        clearInterval(pollInterval);
                        location.reload();
                    }
                });
            }, 500);
        }
        if (/*[[${@activityCenter.isProving()}]]*/ false) { startPolling(); }

        // Load initial tab
        loadTab(activeTab, activeSubTab);
    </script>
</body>
</html>
