<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div style="display: flex; gap: 16px; margin-bottom: 8px; font-size: 11px; font-family: monospace; flex-wrap: wrap;">
        <span><span style="display:inline-block; width:14px; height:14px; background:#212121; opacity:0.3; border:1px solid #333; vertical-align:middle; margin-right:4px;"></span>MatrixMain</span>
        <span><span style="display:inline-block; width:14px; height:14px; background:#e53935; vertical-align:middle; margin-right:4px;"></span>SqlInsert BODY</span>
        <span><span style="display:inline-block; width:14px; height:14px; background:#00897b; vertical-align:middle; margin-right:4px;"></span>SqlInsert HCN</span>
        <span><span style="display:inline-block; width:14px; height:14px; background:#f9a825; vertical-align:middle; margin-right:4px;"></span>SqlInsert INTERVAL</span>
        <span><span style="display:inline-block; width:14px; height:14px; background:#7b1fa2; vertical-align:middle; margin-right:4px;"></span>SqlInsert STRUCTURAL_ACTIVITY</span>
        <span><span style="display:inline-block; width:14px; height:14px; background:#0288d1; vertical-align:middle; margin-right:4px;"></span>SqlInsert EXTENSION_ACTIVITY</span>
        <span><span style="display:inline-block; width:14px; height:14px; background:#558b2f; vertical-align:middle; margin-right:4px;"></span>SqlInsert HCN_GENERATION_ACTIVITY</span>
        <span><span style="display:inline-block; width:14px; height:14px; background:#e91e63; vertical-align:middle; margin-right:4px;"></span>SqlInsert SQL_INSERT_ACTIVITY</span>
        <span><span style="display:inline-block; width:14px; height:14px; background:#795548; vertical-align:middle; margin-right:4px;"></span>SqlInsert BODY_DELETION_EVENT</span>
        <span><span style="display:inline-block; width:14px; height:14px; background:#00acc1; vertical-align:middle; margin-right:4px;"></span>SqlInsert BODY_LIFECYCLE</span>
    </div>
    <div id="activity-tooltip" style="position:fixed; background:#333; color:#fff; padding:4px 8px; font-size:10px; font-family:monospace; border-radius:3px; pointer-events:none; display:none; white-space:pre;"></div>
    <div id="activity-timeline" style="border: 1px solid #ccc; overflow: hidden;"></div>
    <script th:inline="javascript">
    (function() {
        var activities = [];
        /*[# th:each="a : ${dbMatrixMainActivities}"]*/ activities.push({ type: 'MatrixMain', lane: 'MATRIX_MAIN', start: /*[[${a.startNanos}]]*/ 0, end: /*[[${a.finishNanos}]]*/ 0, label: /*[[${a.labelName}]]*/ '', tooltip: /*[[${a.guiLabel}]]*/ '' }); /*[/]*/
        /*[# th:each="a : ${dbSqlInsertActivities}"]*/ activities.push({ type: 'SqlInsert', lane: /*[[${a.table}]]*/ '', start: /*[[${a.startNanos}]]*/ 0, end: /*[[${a.finishNanos}]]*/ 0, label: /*[[${a.labelName}]]*/ '', tooltip: /*[[${a.guiLabel}]]*/ '' }); /*[/]*/

        if (activities.length === 0) return;

        function renderChart() {
        var colors = {
            MATRIX_MAIN: 'rgba(33,33,33,0.25)',
            BODY: '#e53935', HCN: '#00897b', INTERVAL: '#f9a825',
            STRUCTURAL_ACTIVITY: '#7b1fa2', EXTENSION_ACTIVITY: '#0288d1',
            HCN_GENERATION_ACTIVITY: '#558b2f', SQL_INSERT_ACTIVITY: '#e91e63',
            BODY_DELETION_EVENT: '#795548', BODY_LIFECYCLE: '#00acc1'
        };
        var lanes = ['MATRIX_MAIN','BODY','HCN','INTERVAL','STRUCTURAL_ACTIVITY','EXTENSION_ACTIVITY','HCN_GENERATION_ACTIVITY','SQL_INSERT_ACTIVITY','BODY_DELETION_EVENT','BODY_LIFECYCLE'];
        var axisH=30, laneH=60;
        var totalH=axisH+lanes.length*laneH+20;
        var allT=activities.reduce(function(acc,a){acc.push(a.start,a.end);return acc;},[]);
        var minT=d3.min(allT), maxT=d3.max(allT);
        var container=document.getElementById('activity-timeline');
        var W=container.clientWidth || 1200, margin={left:10,right:10};
        container.style.height=totalH+'px';
        var svg=d3.select('#activity-timeline').append('svg').attr('width',W).attr('height',totalH);
        svg.append('defs').append('clipPath').attr('id','lane-clip').append('rect').attr('x',0).attr('y',0).attr('width',W).attr('height',totalH);
        var xScale=d3.scaleLinear().domain([minT,maxT]).range([margin.left,W-margin.right]);
        var gMain=svg.append('g').attr('clip-path','url(#lane-clip)');
        var xAxis=d3.axisTop(xScale).ticks(8);
        var gAxis=svg.append('g').attr('transform','translate(0,'+axisH+')').call(xAxis);
        var gRects=gMain.append('g');
        var tooltip=document.getElementById('activity-tooltip');
        function draw(scale){
            gRects.selectAll('rect').remove(); gRects.selectAll('text').remove();
            activities.forEach(function(a){
                var x1=scale(a.start),x2=scale(a.end),w=Math.max(x2-x1,1);
                var i=lanes.indexOf(a.lane), y=axisH+i*laneH, color=colors[a.lane];
                gRects.append('rect').attr('x',x1).attr('y',y).attr('width',w).attr('height',laneH).attr('rx',3).attr('ry',3).attr('fill',color).style('cursor','pointer')
                    .on('mousemove',function(event){tooltip.style.display='block';tooltip.style.left=(event.clientX+12)+'px';tooltip.style.top=(event.clientY+12)+'px';tooltip.textContent=a.tooltip;})
                    .on('mouseleave',function(){tooltip.style.display='none';});
                if(w>10){gRects.append('text').attr('x',x1+4).attr('y',y+4).attr('font-size','9px').attr('font-family','monospace').attr('fill','#fff').style('writing-mode','vertical-rl').style('text-orientation','mixed').style('pointer-events','none').text(a.label);}
            });
        }
        draw(xScale);
        svg.call(d3.zoom().scaleExtent([1,500]).on('zoom',function(event){var ns=event.transform.rescaleX(xScale);gAxis.call(xAxis.scale(ns));draw(ns);}));
        }
        if (window.d3) { renderChart(); } else {
            var s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js';
            s.onload = renderChart;
            document.head.appendChild(s);
        }
    })();
    </script>
</div>
</body>
</html>
