<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <table class="level-table">
        <thead>
            <tr>
                <th>#</th>
                <th th:each="node : ${matrixChain}" style="white-space: nowrap; width: 1px;"
                    th:text="${node instanceof T(com.hcn.newCore.ApiNode) ?
                        node.indexes.get(0).intValue :
                        node.transitionFrom}"></th>
                <th style="padding-left: 40px;">Value</th>
                <th>Factor</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="row : ${@newCoreController.getBufferBodies()}"
                th:style="${row.deactivated() ? (row.proved() ? 'background-color: #c8e6c9;' : 'background-color: #e0e0e0;') : (row.proved() ? 'background-color: #90EE90;' : '')}">
                <td th:text="${row.index()}"></td>
                <td th:each="cell : ${row.nodeColumns()}" th:text="${cell.label()}" th:style="${cell.color().equals('black') ? 'white-space: nowrap; width: 1px; background-color: black; color: white;' : (!cell.color().isEmpty() ? 'white-space: nowrap; width: 1px; background-color: ' + cell.color() + ';' : 'white-space: nowrap; width: 1px;')}"></td>
                <td th:text="${row.value()}" style="padding-left: 40px;"></td>
                <td th:text="${row.factor()}"></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
