<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <table class="level-table">
        <thead><tr><th>#</th><th>Body</th><th>Value</th><th>Factor</th><th>NonHunterBodyNodes</th></tr></thead>
        <tbody>
            <tr th:each="body, bIter : ${@newCoreController.getBufferBodies()}"
                th:style="${body.deactivated ? (body.proved ? 'background-color: #c8e6c9;' : 'background-color: #e0e0e0;') : (body.proved ? 'background-color: #90EE90;' : '')}">
                <td th:text="${bIter.index}"></td>
                <td th:text="${@newCoreController.guiString(body)}"></td>
                <td th:text="${body.value}"></td>
                <td th:text="${body.factor}"></td>
                <td th:with="nonHunters=${body.getNonHunterBodyNodes()}">
                    <span th:if="${!nonHunters.isEmpty()}" th:each="bn, i : ${nonHunters}">
                        <span th:text="${(i.index > 0 ? ', ' : '') + bn.toString()}"></span>
                    </span>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
