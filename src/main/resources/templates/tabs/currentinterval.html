<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div th:if="${@newCoreController.getCurrentInterval() == null}" style="font-size: 11px; color: #999;">No current interval</div>
    <div th:if="${@newCoreController.getCurrentInterval() != null}">
        <table class="level-table" style="width: auto; margin-bottom: 12px;">
            <thead><tr><th>lapi</th><th>value</th><th>factor</th><th>referenced</th><th>referenceInterval</th></tr></thead>
            <tbody>
                <tr th:with="ci=${@newCoreController.getCurrentInterval()}">
                    <td th:text="${ci.lapi}"></td>
                    <td th:text="${ci.value}"></td>
                    <td th:text="${ci.factor}"></td>
                    <td th:text="${ci.referenced}"></td>
                    <td th:text="${ci.referenceInterval != null ? ci.referenceInterval.lapi : ''}"></td>
                </tr>
            </tbody>
        </table>
        <table class="level-table">
            <thead><tr><th>#</th><th>dbId</th><th>lapi</th><th>value</th><th>factor</th><th>body</th></tr></thead>
            <tbody>
                <tr th:each="hcn, hIter : ${@newCoreController.getCurrentInterval().hcnList}">
                    <td th:text="${hIter.index}"></td>
                    <td th:text="${hcn.body?.dbId}"></td>
                    <td th:text="${hcn.lapiIndex}"></td>
                    <td th:text="${hcn.value}"></td>
                    <td th:text="${hcn.factor}"></td>
                    <td th:text="${@newCoreController.guiString(hcn.body)}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
