<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div th:if="${leftInterval == null}">No intervals in DB</div>
    <div th:if="${leftInterval != null}">
        <div style="font-size:11px; margin-bottom:8px; display:flex; gap:12px; align-items:center;">
            <input type="number" id="lapiInput" th:value="${rightInterval.lapi}" th:max="${highestLapi}" min="2" style="width:80px; font-family:monospace; padding:2px 4px;"/>
            <button onclick="loadSubTab('hcn', document.getElementById('lapiInput').value)" style="font-family:monospace; padding:2px 8px;">Go</button>
            intervals=<b th:text="${intervalCacheSize}"></b>
            bodies=<b th:text="${bodyCacheSize}"></b>
        </div>
        <div style="display:flex; gap:16px; align-items:flex-start;">
            <div>
                <div style="font-size:11px; margin-bottom:4px;">
                    lapi=<b th:text="${leftInterval.lapi}"></b>
                    refInterval=<b th:text="${leftInterval.referenceInterval}"></b>
                    size=<b th:text="${leftInterval.hcnlist.size()}"></b>
                </div>
                <table class="level-table">
                    <thead><tr><th>id</th><th>bodyId</th><th>body</th><th>lapi</th><th>value</th><th>factor</th></tr></thead>
                    <tbody>
                        <tr th:each="hcn : ${leftInterval.hcnlist}">
                            <td th:text="${hcn.id}"></td>
                            <td th:text="${hcn.bodyId}"></td>
                            <td th:text="${hcn.dbBody != null ? hcn.dbBody.toString() : ''}"></td>
                            <td th:text="${hcn.lapi}"></td>
                            <td th:text="${hcn.value}"></td>
                            <td th:text="${hcn.factor}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div>
                <div style="font-size:11px; margin-bottom:4px;">
                    lapi=<b th:text="${rightInterval.lapi}"></b>
                    refInterval=<b th:text="${rightInterval.referenceInterval}"></b>
                    size=<b th:text="${rightInterval.hcnlist.size()}"></b>
                </div>
                <table class="level-table">
                    <thead><tr><th>id</th><th>bodyId</th><th>body</th><th>lapi</th><th>value</th><th>factor</th></tr></thead>
                    <tbody>
                        <tr th:each="hcn : ${rightInterval.hcnlist}">
                            <td th:text="${hcn.id}"></td>
                            <td th:text="${hcn.bodyId}"></td>
                            <td th:text="${hcn.dbBody != null ? hcn.dbBody.toString() : ''}"></td>
                            <td th:text="${hcn.lapi}"></td>
                            <td th:text="${hcn.value}"></td>
                            <td th:text="${hcn.factor}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
