<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div id="database-subtab-bar" style="margin-bottom:8px;">
        <button class="tab-btn" data-subtab="hcn" onclick="loadSubTab('hcn')">Hcn</button>
        <button class="tab-btn" data-subtab="body" onclick="loadSubTab('body')">Body</button>
        <button class="tab-btn" data-subtab="interval" onclick="loadSubTab('interval')">Interval</button>
    </div>
    <div id="subtab-content"></div>
    <script th:inline="javascript">
        var initialSubTab = /*[[${activeSubTab ?: 'hcn'}]]*/ 'hcn';
        window.loadSubTab = function(subtab, lapi) {
            document.querySelectorAll('#database-subtab-bar .tab-btn').forEach(function(b) { b.classList.remove('active'); });
            document.querySelector('#database-subtab-bar .tab-btn[data-subtab="' + subtab + '"]').classList.add('active');
            var url = '/newcore/tab?tab=database&subtab=' + subtab;
            if (lapi) url += '&lapi=' + lapi;
            fetch(url)
                .then(r => r.text())
                .then(html => {
                    var el = document.getElementById('subtab-content');
                    el.innerHTML = html;
                    el.querySelectorAll('script').forEach(function(s) { eval(s.textContent); });
                });
        };
        window.loadSubTab(initialSubTab);
    </script>
</div>
</body>
</html>
