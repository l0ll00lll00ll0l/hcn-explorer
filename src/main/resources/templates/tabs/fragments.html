<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="passingZoneBox(pz)" style="display: flex; gap: 12px; border: 1px solid #aaa; padding: 6px 8px; font-size: 11px;">
    <div>
        <div style="font-weight: bold; margin-bottom: 4px;">passingZone</div>
        <div th:each="hcn : ${pz.passingZone}" th:text="${hcn.toString()}"></div>
    </div>
    <div>
        <div style="font-weight: bold; margin-bottom: 4px;">hunters</div>
        <div th:if="${pz.hunters.isEmpty()}" style="color: #999;">-</div>
        <div th:each="entry : ${pz.hunters}" style="margin-bottom: 2px;">
            <span style="color: #666;" th:text="${entry.key + ': '}"></span>
            <span th:each="hcnGen, hcnStat : ${entry.value}" th:text="${(hcnStat.first ? '' : ', ') + hcnGen.hunterHcn.toString()}"></span>
        </div>
    </div>
</div>
</body>
</html>
