<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div th:each="lapi : ${@newCoreController.getLapiChain()}" style="border: 1px solid #ccc; border-radius: 4px; padding: 8px 12px; margin-bottom: 10px; font-size: 11px;">
        <div style="font-weight: bold; margin-bottom: 6px; font-size: 12px;">
            Lapi <span th:text="${lapi.prime.index}"></span>
            (<span th:text="${lapi.prime.intValue}"></span>)
        </div>
        <div style="display: flex; gap: 24px; margin-bottom: 8px;">
            <span>walker: <b th:text="${lapi.walker != null ? @newCoreController.guiString(lapi.walker) : 'null'}"></b></span>
            <span>valueMultiplier: <b th:text="${lapi.valueMultiplier}"></b></span>
            <span>factorMultiplier: <b th:text="${lapi.factorMultiplier}"></b></span>
        </div>
        <table class="level-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Body</th>
                    <th>Value</th>
                    <th>Factor</th>
                    <th>LapiIndex</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="hcn, hIter : ${lapi.generatedHcns}">
                    <td th:text="${hIter.index}"></td>
                    <td th:text="${hcn.body != null ? @newCoreController.guiString(hcn.body) : ''}"></td>
                    <td th:text="${hcn.value}"></td>
                    <td th:text="${hcn.factor}"></td>
                    <td th:text="${hcn.lapiIndex}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
