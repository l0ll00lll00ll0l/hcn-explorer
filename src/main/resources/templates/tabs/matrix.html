<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="matrix-chain">
        <div th:each="node, iter : ${matrixChain}" class="matrix-box">
            <th:block th:if="${node instanceof T(com.hcn.newCore.ApiNode)}">
                <div class="matrix-box-header" th:text="${node.indexes.isEmpty() ? '?' : node.indexes.get(0).intValue}"></div>
                <div class="matrix-box-content">
                    <div th:each="entry : ${node.bodyNodes.descendingMap()}" class="transition-panel"
                         th:style="'cursor:pointer;' + ${entry.value.proved ? 'background-color: #90EE90;' : ''}"
                         th:onclick="'openBodyNode(' + ${iter.index} + ',' + ${entry.value.bodyNodeId} + ')'">
                        <span class="transition-id" th:text="${entry.value.bodyNodeId}"></span>
                        <span th:text="'(' + ${@newCoreController.totalActiveHcnGen(entry.value)} + '/' + ${entry.value.deactivatedBodies.size()} + ')'"></span>
                    </div>
                    <div th:each="entry : ${node.deactivatedBodyNodes.descendingMap()}" class="transition-panel"
                         th:style="'cursor:pointer; background-color: #e0e0e0;'"
                         th:onclick="'openBodyNode(' + ${iter.index} + ',' + ${entry.value.bodyNodeId} + ')'">
                        <span class="transition-id" th:text="${entry.value.bodyNodeId}"></span>
                        <span th:text="'(' + ${@newCoreController.totalActiveHcnGen(entry.value)} + '/' + ${entry.value.deactivatedBodies.size()} + ')'"></span>
                    </div>
                </div>
                <div class="bodynode-btn" th:attr="onclick='openBodyList(' + ${iter.index} + ')'">
                    <div th:text="'Bodies (' + (${@newCoreController.totalActiveBodyCount(node)} + ${@newCoreController.totalDeactivatedBodyCount(node)}) + ')'"></div>
                    <div th:text="${@newCoreController.totalActiveBodyCount(node)} + ' - ' + ${@newCoreController.totalDeactivatedBodyCount(node)}"></div>
                </div>
                <div class="matrix-box-footer" th:text="${node.indexes.isEmpty() ? 'p?' : 'p' + node.indexes.get(0).index}"></div>
            </th:block>
            <th:block th:if="${node instanceof T(com.hcn.newCore.TransitionNode)}">
                <div class="matrix-box-header" th:text="${node.transitionFrom} + ' → ' + ${node.transitionTo}"></div>
                <div class="matrix-box-content">
                    <div th:each="entry : ${node.bodyNodes.descendingMap()}" class="transition-panel"
                         th:style="'cursor:pointer;' + ${entry.value.proved ? 'background-color: #90EE90;' : ''}"
                         th:onclick="'openBodyNode(' + ${iter.index} + ',' + ${entry.value.bodyNodeId} + ')'">
                        <span class="transition-id" th:text="${entry.value.bodyNodeId}"></span>
                        <span th:text="'(' + ${@newCoreController.totalActiveHcnGen(entry.value)} + '/' + ${entry.value.deactivatedBodies.size()} + ')'"></span>
                    </div>
                    <div th:each="entry : ${node.deactivatedBodyNodes.descendingMap()}" class="transition-panel"
                         th:style="'cursor:pointer; background-color: #e0e0e0;'"
                         th:onclick="'openBodyNode(' + ${iter.index} + ',' + ${entry.value.bodyNodeId} + ')'">
                        <span class="transition-id" th:text="${entry.value.bodyNodeId}"></span>
                        <span th:text="'(' + ${@newCoreController.totalActiveHcnGen(entry.value)} + '/' + ${entry.value.deactivatedBodies.size()} + ')'"></span>
                    </div>
                </div>
                <div class="bodynode-btn" th:attr="onclick='openBodyList(' + ${iter.index} + ')'">
                    <div th:text="'Bodies (' + (${@newCoreController.totalActiveBodyCount(node)} + ${@newCoreController.totalDeactivatedBodyCount(node)}) + ')'"></div>
                    <div th:text="${@newCoreController.totalActiveBodyCount(node)} + ' - ' + ${@newCoreController.totalDeactivatedBodyCount(node)}"></div>
                </div>
                <div class="matrix-box-footer" th:text="${node.indexes.isEmpty() ? 't?' : ('p' + node.indexes.get(0).index + ' → p' + node.indexes.get(node.indexes.size() - 1).index)}"></div>
            </th:block>
        </div>
    </div>
</div>
</body>
</html>
