<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div th:if="${@newCoreController.getPassingZoneList().isEmpty()}" style="font-size: 11px; color: #999;">No passing entries</div>
    <table th:if="${!@newCoreController.getPassingZoneList().isEmpty()}" class="level-table">
        <thead>
            <tr>
                <th>#</th>
                <th>passingHcn</th>
                <th>prayHcn</th>
            </tr>
        </thead>
        <tbody>
            <th:block th:each="passing, pStat : ${@newCoreController.getPassingZoneList()}">
                <tr th:each="prayHcn, rbStat : ${passing.prayHcns}">
                    <td th:if="${rbStat.first}" th:rowspan="${passing.prayHcns.size()}"
                        th:text="${pStat.count}" style="vertical-align: top;"></td>
                    <td th:if="${rbStat.first}" th:rowspan="${passing.prayHcns.size()}"
                        th:text="${passing.passingHcn != null ? passing.passingHcn.toString() : '-'}"
                        style="vertical-align: top;"></td>
                    <td th:text="${prayHcn.toString()}"></td>
                </tr>
            </th:block>
        </tbody>
    </table>
</div>
</body>
</html>
