<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div th:if="${@newCoreController.getPassingZoneList().isEmpty()}" style="font-size: 11px; color: #999;">No passingZone entries</div>
    <div th:each="pb : ${@newCoreController.getPassingZoneList()}"
         style="margin-bottom: 12px; border: 1px solid #333; padding: 6px 8px;">
        <div th:replace="~{tabs/fragments :: passingZoneBox(${pb})}"></div>
    </div>
</div>
</body>
</html>
