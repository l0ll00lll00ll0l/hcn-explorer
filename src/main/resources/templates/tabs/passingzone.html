<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div th:if="${@newCoreController.getPassingZoneList().isEmpty()}" style="font-size: 11px; color: #999;">No passingZone entries</div>
    <div th:each="pb : ${@newCoreController.getPassingZoneList()}"
         style="margin-bottom: 12px; border: 1px solid #333; padding: 6px 8px;">
        <div style="display: flex; gap: 12px; border: 1px solid #aaa; padding: 6px 8px; font-size: 11px;">
            <div>
                <div style="font-weight: bold; margin-bottom: 4px;">passingZone</div>
                <div th:each="hcn : ${pb.passingZone}" th:text="${hcn.toString()}"></div>
            </div>
            <div>
                <div style="font-weight: bold; margin-bottom: 4px;">nonPassingHcns</div>
                <div th:if="${pb.nonPassingHcns.isEmpty()}" style="color: #999;">-</div>
                <div th:each="hcn : ${pb.nonPassingHcns}" th:text="${hcn.toString()}"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
