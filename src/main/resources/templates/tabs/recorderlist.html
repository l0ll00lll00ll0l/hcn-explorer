<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div style="font-size: 11px; margin-bottom: 12px;">
        <span>targetValue: <b th:text="${@newCoreController.getCurrentIntervalTargetValue()}"></b></span>
    </div>
    <div th:each="rb, bodyStat : ${@newCoreController.getRecorderList()}"
         style="margin-bottom: 12px; border: 1px solid #333;">
        <table class="level-table" style="font-size: 11px;">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Body</th>
                    <th>Pray</th>
                    <th>IntervalLapiDist</th>
                </tr>
            </thead>
            <tbody>
                <tr th:style="${rb.body.deactivated ? 'background:#ff9999;' : 'background:#e8f5e9;'}">
                    <td th:text="${bodyStat.index}"></td>
                    <td th:text="${@newCoreController.guiString(rb.body)}"></td>
                    <td th:text="${@newCoreController.guiString(rb.prayBody?.body)}"></td>
                    <td th:text="${rb.intervalLapiDistance}"></td>
                </tr>
            </tbody>
        </table>
        <div style="display: flex; gap: 12px; align-items: flex-start; margin: 4px 8px 8px 8px;">
            <div th:if="${rb.passingZone != null}" style="display: flex; gap: 12px; border: 1px solid #aaa; padding: 6px 8px; font-size: 11px;">
                <div>
                    <div style="font-weight: bold; margin-bottom: 4px;">passingZone</div>
                    <div th:each="hcn : ${rb.passingZone.passingZone}" th:text="${hcn.toString()}"></div>
                </div>
                <div>
                    <div style="font-weight: bold; margin-bottom: 4px;">nonPassingHcns</div>
                    <div th:if="${rb.passingZone.nonPassingHcns.isEmpty()}" style="color: #999;">-</div>
                    <div th:each="hcn : ${rb.passingZone.nonPassingHcns}" th:text="${hcn.toString()}"></div>
                </div>
            </div>
            <div th:if="${rb.passingZone == null}" style="border: 1px solid #ddd; padding: 6px 8px; font-size: 10px; color: #999; min-width: 160px;">no passingZone</div>

        </div>
    </div>

</div>
</body>
</html>
