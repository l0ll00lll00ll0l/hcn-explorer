<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div style="font-size: 11px; margin-bottom: 12px;">
        <span>targetValue: <b th:text="${@newCoreController.getCurrentIntervalTargetValue()}"></b></span>
    </div>
    <div th:each="rb, bodyStat : ${@newCoreController.getRecorderList()}"
         style="margin-bottom: 12px; border: 1px solid #333;">
        <table class="level-table" style="font-size: 11px;">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Body</th>
                    <th>Value</th>
                    <th>Factor</th>
                    <th>Lapi</th>
                    <th>Pray</th>
                    <th>IntervalLapiDist</th>
                </tr>
            </thead>
            <tbody>
                <tr th:style="${rb.body.deactivated ? 'background:#ff9999;' : 'background:#e8f5e9;'}">
                    <td th:text="${bodyStat.index}"></td>
                    <td th:text="${@newCoreController.guiString(rb.body)}"></td>
                    <td th:text="${rb.currentHcn?.value}"></td>
                    <td th:text="${rb.currentHcn?.factor}"></td>
                    <td th:text="${rb.currentHcn?.lapiIndex}"></td>
                    <td th:text="${@newCoreController.guiString(rb.prayBody?.body)}"></td>
                    <td th:text="${rb.intervalLapiDistance}"></td>
                </tr>
            </tbody>
        </table>
        <div th:if="${!rb.hunters.isEmpty()}" style="margin: 4px 8px 8px 24px;">
            <div style="font-size: 10px; color: #666; margin-bottom: 2px;">hunters:</div>
            <table class="level-table" style="font-size: 11px; width: auto;">
                <thead>
                    <tr>
                        <th>Body</th>
                        <th>Value</th>
                        <th>Factor</th>
                        <th>Lapi Distance</th>
                        <th>Pray</th>
                        <th>PrayLapiDist</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="hunter : ${rb.hunters}"
                        th:style="${hunter.body.deactivated ? 'background:#ff9999;' : ''}">
                        <td th:text="${@newCoreController.guiString(hunter.body)}"></td>
                        <td th:text="${hunter.getCurrentHunterHcn.value}"></td>
                        <td th:text="${hunter.getCurrentHunterHcn.factor}"></td>
                        <td th:text="${hunter.getCurrentHunterHcn.lastActivePrime.index}"></td>
                        <td th:text="${@newCoreController.guiString(hunter.prayBody?.body)}"></td>
                        <td th:text="${hunter.prayLapiDistance}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${rb.hunters.isEmpty()}" style="margin: 2px 8px 6px 24px; font-size: 10px; color: #999;">no hunters</div>
    </div>

</div>
</body>
</html>
