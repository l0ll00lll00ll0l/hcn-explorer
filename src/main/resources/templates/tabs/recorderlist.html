<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div style="font-size: 11px; margin-bottom: 12px;">
        <span>targetValue: <b th:text="${@newCoreController.getCurrentIntervalTargetValue()}"></b></span>
    </div>
    <div th:each="rb, bodyStat : ${@newCoreController.getRecorderList()}"
         style="margin-bottom: 12px; border: 1px solid #333;">
        <table class="level-table" style="font-size: 11px;">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Body</th>
                    <th>IntervalLapiDist</th>
                </tr>
            </thead>
            <tbody>
                <tr th:style="${rb.hcnGenerator.body.deactivated ? 'background:#ff9999;' : 'background:#e8f5e9;'}">
                    <td th:text="${bodyStat.index}"></td>
                    <td th:text="${@newCoreController.guiString(rb.hcnGenerator.body)}"></td>
                    <td th:text="${rb.intervalLapiDistance}"></td>
                </tr>
            </tbody>
        </table>
        <div style="display: flex; gap: 12px; align-items: flex-start; margin: 4px 8px 8px 8px;">
            <div th:replace="~{tabs/fragments :: passingZoneBox(${rb})}"></div>

        </div>
    </div>

</div>
</body>
</html>
