<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div th:with="recorderList=${@newCoreController.getRecorderList()},
                  lastKey=${recorderList[0].hunters.lastKey()}">
        <table class="level-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th th:each="col : ${#numbers.sequence(0, lastKey)}" th:text="${col}"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="rb : ${recorderList}">
                    <td th:text="${rb.order}"></td>
                    <td th:each="col : ${#numbers.sequence(0, lastKey)}"
                        th:text="${col == rb.intervalLapiDistance ? rb.prayHcn.getValueFactorString() : (rb.hunters.containsKey(col) ? rb.hunters.get(col).getValueFactorString() : '')}"
                        th:style="${col == rb.intervalLapiDistance ? 'background:#cce5ff;' : (rb.hunters.containsKey(col) ? 'background:#e8f5e9;' : '')}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
